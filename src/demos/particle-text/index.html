<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="/no-ff-webgpu.js"></script>
    <title>Particle Text — Motif</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #f7f4ee;
      }
      #app {
        position: relative;
        width: 100%;
        height: 100%;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #panel {
        position: absolute;
        top: 14px;
        left: 14px;
        right: 14px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        font:
          500 12px "Inter",
          sans-serif;
        z-index: 10;
        background: rgba(255, 255, 255, 0.86);
        border: 1px solid rgba(42, 39, 35, 0.16);
        border-radius: 10px;
        padding: 10px 12px;
        color: #2a2723;
      }
      #panel .field {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      #panel label {
        color: #6b6459;
        font-size: 11px;
        white-space: nowrap;
      }
      #panel input[type="text"] {
        width: 92px;
        border: 1px solid rgba(42, 39, 35, 0.2);
        border-radius: 6px;
        padding: 5px 7px;
        font: inherit;
        background: #fff;
        color: #2a2723;
        text-transform: uppercase;
      }
      #panel input[type="text"]:focus {
        outline: 2px solid #d97757;
        outline-offset: 1px;
      }
      #panel input[type="range"] {
        width: 84px;
        accent-color: #d97757;
      }
      #panel input[type="color"] {
        width: 26px;
        height: 26px;
        padding: 0;
        border: 1px solid rgba(42, 39, 35, 0.2);
        border-radius: 6px;
        cursor: pointer;
        background: none;
      }
      #panel .value {
        font:
          500 11px "JetBrains Mono",
          monospace;
        color: #6b6459;
        min-width: 32px;
      }
      #panel button {
        border: 1px solid rgba(42, 39, 35, 0.16);
        background: #2a2723;
        color: #f7f4ee;
        border-radius: 7px;
        padding: 6px 14px;
        cursor: pointer;
        font: 600 12px inherit;
      }
      #panel button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      #panel .divider {
        width: 1px;
        height: 20px;
        background: rgba(42, 39, 35, 0.14);
      }
      #hud {
        position: absolute;
        top: 68px;
        left: 14px;
        font:
          500 12px "JetBrains Mono",
          monospace;
        color: #2a2723;
        background: rgba(255, 255, 255, 0.7);
        border: 1px solid rgba(42, 39, 35, 0.16);
        border-radius: 7px;
        padding: 8px 12px;
        line-height: 1.6;
        z-index: 10;
        white-space: pre;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "@vectojs/core": "https://esm.sh/@vectojs/core@1.25.0"
        }
      }
    </script>
  </head>
  <body>
    <div id="app">
      <canvas id="canvas"></canvas>
      <div id="panel">
        <div class="field">
          <label for="input-origin">From</label>
          <input
            id="input-origin"
            type="text"
            value="VECTOJS"
            maxlength="12"
            spellcheck="false"
            autocomplete="off"
          />
        </div>
        <div class="field">
          <label for="input-target">To</label>
          <input
            id="input-target"
            type="text"
            value="CANVAS"
            maxlength="12"
            spellcheck="false"
            autocomplete="off"
          />
        </div>
        <button id="btn-transform">Transform</button>
        <div class="divider"></div>
        <div class="field">
          <label for="input-count">Particles</label>
          <input
            id="input-count"
            type="range"
            min="200"
            max="3000"
            step="100"
            value="1400"
          />
          <span class="value" id="value-count">1400</span>
        </div>
        <div class="field">
          <label for="input-duration">Duration</label>
          <input
            id="input-duration"
            type="range"
            min="3"
            max="30"
            step="1"
            value="12"
          />
          <span class="value" id="value-duration">1.2s</span>
        </div>
        <div class="divider"></div>
        <div class="field">
          <label for="input-color-a">Color</label>
          <input id="input-color-a" type="color" value="#d97757" />
          <input id="input-color-b" type="color" value="#38bdf8" />
        </div>
      </div>
      <div id="hud">measuring…</div>
    </div>
    <script type="module" src="./demo.js"></script>
  </body>
</html>
